schema: spec-driven

context: |
  Project: pi-project-switcher — a pi coding agent extension (TypeScript, single index.ts, no build step).
  Runtime: pi (@earendil-works/pi-coding-agent), loaded from ~/.pi/agent/extensions/ or installed via `pi install`.
  
  Purpose: Switch between projects under a configurable base directory.
  Each direct subdirectory of the base dir is a project (git optional, NOT required).
  
  Key requirements from maintainer:
  1. Targets are BOTH native pi TUI/RPC sessions and remote use via the
     pi-telegram bridge (with pi-telegram-command-bridge re-dispatching
     extension commands). Surface-adaptive output is a core concern.
  2. Only the base directory is configured (default ~/dev). Every direct
     subdirectory = project, discovered dynamically (no hardcoded project list).
  3. /project command: show current, list all, switch. Bare /project adapts
     to the surface (TUI select dialog, Telegram buttons, plain list).
  4. Switch = set active project + inject project context into system prompt
     via before_agent_start + session naming.
  
  Conventions: TypeScript loaded directly via jiti (no compilation),
  MIT license, conventional commits.
